# Default DSP Laboratory Configuration
dsp:
  signal_type: "sine"
  frequencies_hz: [100.0, 250.0]
  amplitudes: [1.0, 0.5]
  phases_rad: [0.0, 0.0]
  sampling_rate_hz: 1000.0
  duration_sec: 1.0
  snr_db: null

filter:
  filter_type: "lowpass"
  design_method: "firwin"
  cutoff_hz: [200.0]
  order: 32
  window: "hamming"
